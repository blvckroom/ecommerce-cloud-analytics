version: 2
models:
- name: stg_customers
  columns:
  - name: customer_id
    data_tests:
    - unique
    - not_null
  - name: customer_unique_id
    data_tests:
    - not_null
- name: stg_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_tests:
    - not_null
  - name: purchased_at
    data_tests:
    - not_null
  - name: order_status
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - delivered
          - invoiced
          - shipped
          - processing
          - unavailable
          - canceled
          - created
          - approved
- name: stg_order_items
  columns:
  - name: order_id
    data_tests:
    - not_null
  - name: order_item_id
    data_tests:
    - not_null
  - name: product_id
    data_tests:
    - not_null
  - name: seller_id
    data_tests:
    - not_null
  - name: item_price
    data_tests:
    - not_null
  - name: freight_value
    data_tests:
    - not_null
- name: stg_payments
  columns:
  - name: order_id
    data_tests:
    - not_null
  - name: payment_sequential
    data_tests:
    - not_null
  - name: payment_value
    data_tests:
    - not_null
- name: stg_reviews
  columns:
  - name: source_row_number
    data_tests:
    - unique
    - not_null
  - name: review_id
    data_tests:
    - not_null
  - name: order_id
    data_tests:
    - not_null
  - name: review_score
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 1
          - 2
          - 3
          - 4
          - 5
          quote: false
- name: stg_products
  columns:
  - name: product_id
    data_tests:
    - unique
    - not_null
- name: stg_sellers
  columns:
  - name: seller_id
    data_tests:
    - unique
    - not_null
- name: stg_category_translation
  columns:
  - name: product_category_name
    data_tests:
    - unique
    - not_null
