version: 2
models:
- name: fct_orders
  description: One row per source order, retaining all order statuses.
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: customer_id
    data_tests:
    - not_null
  - name: customer_unique_id
    data_tests:
    - not_null
  - name: purchased_at
    data_tests:
    - not_null
- name: mart_sales_monthly
  description: Monthly delivered merchandise sales, January 2017 through July 2018.
  columns:
  - name: purchase_month
    data_tests:
    - unique
    - not_null
  - name: merchandise_gmv
    data_tests:
    - not_null
  - name: delivered_orders
    data_tests:
    - not_null
  - name: purchasing_customers
    data_tests:
    - not_null
- name: fct_order_items
  description: One row per source order item, retaining all statuses.
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: order_item_id
    data_tests:
    - not_null
  - name: product_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: seller_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_sellers')
          field: seller_id
  - name: customer_unique_id
    data_tests:
    - not_null
  - name: order_status
    data_tests:
    - not_null
  - name: purchased_at
    data_tests:
    - not_null
  - name: item_price
    data_tests:
    - not_null
  - name: freight_value
    data_tests:
    - not_null
  - name: category_name
    data_tests:
    - not_null
- name: mart_category_monthly
  description: Delivered item sales by purchase month and category.
  columns:
  - name: purchase_month
    data_tests:
    - not_null
  - name: category_name
    data_tests:
    - not_null
  - name: merchandise_gmv
    data_tests:
    - not_null
  - name: item_count
    data_tests:
    - not_null
  - name: delivered_orders
    data_tests:
    - not_null
  - name: purchasing_customers
    data_tests:
    - not_null
- name: mart_state_monthly
  description: Delivered sales and delivery coverage by purchase month and order-associated
    customer state.
  columns:
  - name: purchase_month
    data_tests:
    - not_null
  - name: customer_state
    data_tests:
    - not_null
  - name: merchandise_gmv
    data_tests:
    - not_null
  - name: delivered_orders
    data_tests:
    - not_null
  - name: purchasing_customers
    data_tests:
    - not_null
  - name: aov
    data_tests:
    - not_null
  - name: delivery_date_eligible_orders
    data_tests:
    - not_null
  - name: late_orders
    data_tests:
    - not_null
