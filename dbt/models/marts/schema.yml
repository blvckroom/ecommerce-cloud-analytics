version: 2

models:
  - name: fct_orders
    description: One row per source order, retaining all order statuses.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: customer_id
        data_tests:
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: purchased_at
        data_tests:
          - not_null
